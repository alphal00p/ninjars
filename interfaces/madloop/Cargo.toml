[package]
name = "madloop-ninjars"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[lib]
name = "madloop_ninjars"
crate-type = ["staticlib", "rlib"]

[dependencies]
ninjars = { git = "https://github.com/alphal00p/ninjars", rev = "41db467aa9d07cd0b926bf1a8cfbb83a17a40cc9" }
ninjars-symbolica = { git = "https://github.com/alphal00p/ninjars", rev = "41db467aa9d07cd0b926bf1a8cfbb83a17a40cc9", features = ["native-masters"] }
symbolica = { version = "3.0.1", default-features = false, features = ["integer-gmp", "float-mpfr", "bincode", "serde", "tracing_max_level_info"] }

[patch.crates-io]
symbolica = { git = "https://github.com/symbolica-dev/symbolica.git", rev = "0e2ad04c4f281e28bd29d5ad8b1bebf2764379b7" }
numerica = { git = "https://github.com/symbolica-dev/symbolica.git", rev = "0e2ad04c4f281e28bd29d5ad8b1bebf2764379b7" }
graphica = { git = "https://github.com/symbolica-dev/symbolica.git", rev = "0e2ad04c4f281e28bd29d5ad8b1bebf2764379b7" }
symbolica-typst-plugin = { git = "https://github.com/symbolica-dev/symbolica-typst-plugin", rev = "57b7455b37c30f4f87353c0073e49f5225e937ab" }

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
serde_json = {version="1",features=["float_roundtrip"]}

[build-dependencies]
cc = "1"

[features]
fenv-test-support = []
