# Standalone (non-workspace) bench: oneloopmaster's direct native Rust masters
# (feature generated-evaluators, NativeEvaluator<f64>) on exactly the OneLOop
# calls original Ninja makes (validation/benchmark/ninja/<case>.masters.json).
#
# This manifest builds against the pinned git revisions of the NinjaRS
# workspace (oneloopmaster and the patched Symbolica). build_native.py builds
# the same sources against exact git snapshots of other revisions (e.g. the
# binary64-dilogarithm Symbolica integration) by generating a manifest copy.
[package]
name = "masters-native-bench"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
# NativeTensorEvaluator B11/B111 for Ninja's rank-2/3 bubble calls (oneloopmaster
# claude/native-masters a92b148 or later).
tensor = []

[dependencies]
oneloop = { git = "https://github.com/alphal00p/oneloopmaster.git", rev = "a7cf45876b2273f2c1b5dd1490d88abc07a6f287", default-features = false, features = ["generated-evaluators"] }
symbolica = { version = "3.0.1", default-features = false, features = ["integer-gmp", "float-mpfr", "bincode", "serde", "tracing_max_level_info"] }
serde_json = "1"

[patch.crates-io]
symbolica = { git = "https://github.com/ValentinHirschi/symbolica.git", rev = "b9eaa735862e7d22d7694a14da02f2498342e29a" }
numerica = { git = "https://github.com/ValentinHirschi/symbolica.git", rev = "b9eaa735862e7d22d7694a14da02f2498342e29a" }
graphica = { git = "https://github.com/ValentinHirschi/symbolica.git", rev = "b9eaa735862e7d22d7694a14da02f2498342e29a" }

# Same as NinjaRS's release profile.
[profile.release]
lto = "thin"
codegen-units = 1
