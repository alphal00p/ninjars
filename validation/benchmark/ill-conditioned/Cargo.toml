[package]
name = "ill-conditioned-lanes"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
ninjars = { path = "../../../crates/ninjars" }
ninjars-symbolica = { path = "../../../crates/ninjars-symbolica" }
oneloop = { path = "../../../references/oneloopmaster", default-features = false }
symbolica = { version = "3.0.1", default-features = false, features = ["integer-gmp", "float-mpfr", "bincode", "serde", "tracing_max_level_info"] }
serde_json = "1"

[patch.crates-io]
symbolica = { path = "../../../references/symbolica" }
numerica = { path = "../../../references/symbolica/lib/numerica" }
graphica = { path = "../../../references/symbolica/lib/graphica" }
symbolica-typst-plugin = { git = "https://github.com/symbolica-dev/symbolica-typst-plugin", rev = "57b7455b37c30f4f87353c0073e49f5225e937ab" }
typst-library = { path = "../../../references/gammaloop_ninja_shared/vendor/typst-library" }
typst-svg = { path = "../../../references/gammaloop_ninja_shared/vendor/typst-svg" }
clarabel = { path = "../../../references/gammaloop_ninja_shared/vendor/clarabel" }

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
incremental = false
debug = false

[profile.release.package.ninjars]
codegen-units = 1
[profile.release.package.ninjars-symbolica]
codegen-units = 1
[profile.release.package.oneloop]
codegen-units = 1
