[package]
name = "ill-conditioned-lanes"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
ninjars = { path = "../../../crates/ninjars" }
ninjars-symbolica = { path = "../../../crates/ninjars-symbolica" }
oneloop = { git = "https://github.com/alphal00p/oneloopmaster.git", rev = "a7cf45876b2273f2c1b5dd1490d88abc07a6f287", default-features = false }
symbolica = { version = "3.0.1", default-features = false, features = ["integer-gmp", "float-mpfr", "bincode", "serde", "tracing_max_level_info"] }
serde_json = "1"

[patch.crates-io]
symbolica = { git = "https://github.com/ValentinHirschi/symbolica.git", rev = "b9eaa735862e7d22d7694a14da02f2498342e29a" }
numerica = { git = "https://github.com/ValentinHirschi/symbolica.git", rev = "b9eaa735862e7d22d7694a14da02f2498342e29a" }
graphica = { git = "https://github.com/ValentinHirschi/symbolica.git", rev = "b9eaa735862e7d22d7694a14da02f2498342e29a" }
symbolica-typst-plugin = { git = "https://github.com/symbolica-dev/symbolica-typst-plugin", rev = "57b7455b37c30f4f87353c0073e49f5225e937ab" }

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
incremental = false
debug = false

[profile.release.package.ninjars]
codegen-units = 1
[profile.release.package.ninjars-symbolica]
codegen-units = 1
[profile.release.package.oneloop]
codegen-units = 1
