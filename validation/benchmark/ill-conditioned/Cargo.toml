[package]
name = "ill-conditioned-lanes"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
ninjars = { path = "../../../crates/ninjars" }
ninjars-symbolica = { path = "../../../crates/ninjars-symbolica" }
oneloop = { git = "https://github.com/alphal00p/oneloopmaster.git", rev = "07fc754f656c4744c9464f7c0f47d00b708b37e6", default-features = false }
symbolica = { version = "3.0.1", default-features = false, features = ["integer-gmp", "float-mpfr", "bincode", "serde", "tracing_max_level_info"] }
serde_json = "1"

[patch.crates-io]
symbolica = { git = "https://github.com/symbolica-dev/symbolica.git", rev = "d0424f9e414d3007889f8a98b404a1b1a91b37a7" }
numerica = { git = "https://github.com/symbolica-dev/symbolica.git", rev = "d0424f9e414d3007889f8a98b404a1b1a91b37a7" }
graphica = { git = "https://github.com/symbolica-dev/symbolica.git", rev = "d0424f9e414d3007889f8a98b404a1b1a91b37a7" }
symbolica-typst-plugin = { git = "https://github.com/symbolica-dev/symbolica-typst-plugin", rev = "57b7455b37c30f4f87353c0073e49f5225e937ab" }

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
incremental = false
debug = false

[profile.release.package.ninjars]
codegen-units = 1
[profile.release.package.ninjars-symbolica]
codegen-units = 1
[profile.release.package.oneloop]
codegen-units = 1
