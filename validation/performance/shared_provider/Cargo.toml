[package]
name = "ninjars-shared-provider-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
native-kernels = ["ninjars-symbolica/native-kernels"]
allocation-diagnostics = []
execution-diagnostics = []

[dependencies]
ninjars = { path = "../../../crates/ninjars" }
ninjars-symbolica = { path = "../../../crates/ninjars-symbolica" }
ninjars-graph = { path = "../../../crates/ninjars-graph", features = ["numerator-jit"] }
feynkit-graph = { git = "https://github.com/alphal00p/gammaloop.git", rev = "ee18b8e6386cb36ca88b1917e00ab2ebae93e68e", default-features = false, features = ["native"] }
feynkit-kinematics = { git = "https://github.com/alphal00p/gammaloop.git", rev = "ee18b8e6386cb36ca88b1917e00ab2ebae93e68e" }
symbolica = { version = "3.0.1", default-features = false, features = ["integer-gmp", "float-mpfr", "bincode", "serde", "tracing_max_level_info"] }

[patch.crates-io]
symbolica = { git = "https://github.com/alphal00p/symbolica.git", rev = "9cdc2949cdb153478c1eca0d40690dc0abfc616e" }
numerica = { git = "https://github.com/alphal00p/symbolica.git", rev = "9cdc2949cdb153478c1eca0d40690dc0abfc616e" }
graphica = { git = "https://github.com/alphal00p/symbolica.git", rev = "9cdc2949cdb153478c1eca0d40690dc0abfc616e" }
symbolica-typst-plugin = { git = "https://github.com/symbolica-dev/symbolica-typst-plugin", rev = "57b7455b37c30f4f87353c0073e49f5225e937ab" }

[profile.dev.package."*"]
opt-level = 2

# Match the production workspace's optimized profile exactly.
[profile.release]
lto = "thin"
codegen-units = 1

[[example]]
name = "native_domain_probe"
required-features = ["native-kernels"]
