[package]
name = "ninjars-symbolica"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Symbolica numerator adapters and master integration for NinjaRS"

[features]
reference-codegen = ["symbolica/native_code_generation"]
rust-codegen = ["oneloop/rust-codegen"]
native-kernels = ["rust-codegen"]

[[example]]
name = "generate_reference"
required-features = ["reference-codegen"]

[[example]]
name = "generate_rust_kernels"
required-features = ["rust-codegen"]

[[example]]
name = "generate_native_denominators"
required-features = ["rust-codegen"]

[[example]]
name = "generate_native_bubbles"
required-features = ["rust-codegen"]

[[example]]
name = "generate_native_tadpoles"
required-features = ["rust-codegen"]

[[example]]
name = "generate_native_rank_specializations"
required-features = ["rust-codegen"]

[[example]]
name = "inventory_laurent_catalog"
required-features = ["rust-codegen"]

[[example]]
name = "generate_blocking_fixture"
required-features = ["rust-codegen"]

[dependencies]
ninjars.workspace = true
symbolica.workspace = true
oneloop.workspace = true
symbolica-utils.workspace = true

[dev-dependencies]
serde_json.workspace = true
