[package]
name = "ninjars-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Standalone graph preparation and reduction with NinjaRS"

[features]
numerator-jit = ["ninjars-graph/numerator-jit"]
reference-codegen = ["ninjars-symbolica/reference-codegen"]

[[bin]]
name = "ninjars"
path = "src/main.rs"

[dependencies]
ninjars.workspace = true
ninjars-symbolica.workspace = true
oneloop.workspace = true
ninjars-graph.workspace = true
symbolica.workspace = true
feynkit-model.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
