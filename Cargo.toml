[workspace]
resolver = "3"
members = ["crates/ninjars", "crates/ninjars-positional", "crates/ninjars-symbolica", "crates/ninjars-graph", "crates/ninjars-cli"]
exclude = ["references", "interfaces/madloop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "0BSD"

[workspace.dependencies]
ninjars = { path = "crates/ninjars" }
ninjars-positional = { path = "crates/ninjars-positional" }
ninjars-symbolica = { path = "crates/ninjars-symbolica" }
ninjars-graph = { path = "crates/ninjars-graph" }
symbolica = { version = "3.0.1", default-features = false, features = ["integer-gmp", "float-mpfr", "bincode", "serde", "tracing_max_level_info"] }
numerica = { version = "3.0.1", default-features = false }
feynkit-kinematics = { git = "https://github.com/ValentinHirschi/gammaloop.git", rev = "ea3faaae063b1400570c15cf7e055f48312e9329", default-features = false, features = ["native"] }
feynkit-graph = { git = "https://github.com/ValentinHirschi/gammaloop.git", rev = "ea3faaae063b1400570c15cf7e055f48312e9329", default-features = false, features = ["native"] }
feynkit-model = { git = "https://github.com/ValentinHirschi/gammaloop.git", rev = "ea3faaae063b1400570c15cf7e055f48312e9329", default-features = false, features = ["native"] }
feynkit-generator = { git = "https://github.com/ValentinHirschi/gammaloop.git", rev = "ea3faaae063b1400570c15cf7e055f48312e9329", default-features = false, features = ["native"] }
feynkit-amplitude = { git = "https://github.com/ValentinHirschi/gammaloop.git", rev = "ea3faaae063b1400570c15cf7e055f48312e9329", default-features = false, features = ["native"] }
spenso = { git = "https://github.com/ValentinHirschi/gammaloop.git", rev = "ea3faaae063b1400570c15cf7e055f48312e9329", default-features = false, features = ["native", "shadowing"] }
idenso = { git = "https://github.com/ValentinHirschi/gammaloop.git", rev = "ea3faaae063b1400570c15cf7e055f48312e9329", default-features = false, features = ["native"] }
symbolica-utils = { git = "https://github.com/ValentinHirschi/gammaloop.git", rev = "ea3faaae063b1400570c15cf7e055f48312e9329", default-features = false, features = ["native"] }
oneloop = { git = "https://github.com/alphal00p/oneloopmaster.git", rev = "2e7afabb5903814196d7ab39c695ed9cac777aa4", default-features = false }
linnet = { git = "https://github.com/ValentinHirschi/gammaloop.git", rev = "ea3faaae063b1400570c15cf7e055f48312e9329", default-features = false, features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: correctly rounded float parsing. The default parser reads
# about 3% of shortest round-trip binary64 decimals one ulp off.
serde_json = { version = "1", features = ["float_roundtrip"] }
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

# Symbolica: upstream symbolica-dev/symbolica `community` 0e2ad04c, one revision
# for all three crates, shared with pyAmpliCol and oneloopmaster's own
# standalone [patch] (only the root's [patch] applies in a build).
[patch.crates-io]
symbolica = { git = "https://github.com/symbolica-dev/symbolica.git", rev = "0e2ad04c4f281e28bd29d5ad8b1bebf2764379b7" }
numerica = { git = "https://github.com/symbolica-dev/symbolica.git", rev = "0e2ad04c4f281e28bd29d5ad8b1bebf2764379b7" }
graphica = { git = "https://github.com/symbolica-dev/symbolica.git", rev = "0e2ad04c4f281e28bd29d5ad8b1bebf2764379b7" }
symbolica-typst-plugin = { git = "https://github.com/symbolica-dev/symbolica-typst-plugin", rev = "57b7455b37c30f4f87353c0073e49f5225e937ab" }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2

# Fast-turnaround optimized profile for development benchmarks. The hot
# reduction, adapter and master crates keep a single codegen unit; the large
# graph/model dependency tree is not link-time optimized.
[profile.perf]
inherits = "release"
lto = false
codegen-units = 16
incremental = false

[profile.perf.package.ninjars]
codegen-units = 1

[profile.perf.package.ninjars-symbolica]
codegen-units = 1

[profile.perf.package.oneloop]
codegen-units = 1
